name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  forge-test:
    name: Forge Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge tests
        run: forge test -vvv

  forge-coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Run coverage
        id: coverage
        run: |
          # --ir-minimum is required, not an optimisation: coverage turns the optimizer off, and
          # Fundraise does not fit the stack without it, so plain `forge coverage` fails to compile.
          # `|| true` is deliberate: this measures a differently-compiled artifact than the one
          # that ships — deployment goes through hardhat with the optimizer on — so a coverage run
          # that cannot compile must not block a merge.
          OUTPUT=$(forge coverage --ir-minimum --report summary 2>&1) || true
          echo "$OUTPUT"
          # Columns of the summary table are Lines | Statements | Branches | Functions, so the
          # line-coverage figure is field 3 of the pipe-separated Total row.
          PERCENT=$(echo "$OUTPUT" | grep -E '^\| Total' | awk -F'|' '{print $3}' | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -z "$PERCENT" ]; then
            # Not an error, but not a zero either: zero is indistinguishable from genuinely bad
            # coverage. Leave the output empty, the badge step below then skips and keeps its
            # previous value, and the warning says why.
            echo "::warning::coverage produced no summary; the badge keeps its previous value"
            exit 0
          fi
          echo "coverage=$PERCENT" >> "$GITHUB_OUTPUT"
          # Badge color
          PCT_INT=${PERCENT%.*}
          if [ "$PCT_INT" -ge 80 ]; then
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif [ "$PCT_INT" -ge 60 ]; then
            echo "color=yellow" >> "$GITHUB_OUTPUT"
          elif [ "$PCT_INT" -ge 40 ]; then
            echo "color=orange" >> "$GITHUB_OUTPUT"
          else
            echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Create coverage badge
        # Publishing the badge needs GIST_TOKEN and COVERAGE_GIST_ID; a missing secret must not
        # turn the build red, since the coverage run itself already succeeded.
        continue-on-error: true
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.coverage.outputs.coverage != ''
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage-badge.json
          label: coverage
          message: ${{ steps.coverage.outputs.coverage }}%
          color: ${{ steps.coverage.outputs.color }}

  hardhat-test:
    name: Hardhat Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No separate compile step: `hardhat test` compiles what it needs.
      # BASE_RPC_URL is optional: unset, the config falls back to Base's public endpoint, which
      # works but is slow. Set the secret to make this job fast and less rate-limit prone.
      - name: Run Hardhat tests
        run: npx hardhat test
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}

  deployed-versions:
    name: Deployed Versions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history: the check asks whether each deployedFrom is reachable from main, and a
      # shallow clone cannot answer that. No ref override either — on a pull_request the default
      # merge ref is what we want, because a PR may be the thing that brings a record back in step
      # and it has to be judged on the config that will land in main.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # checkout leaves no origin/main on a merge ref, and the ancestry check needs one to compare
      # against.
      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # Reads two networks and writes nothing. BASE_RPC_URL decides the verdict and is worth a
      # secret; without either variable the script falls back to the public endpoints, which are
      # slower but answer eth_getStorageAt and eth_getCode perfectly well.
      - name: Check deployed versions
        id: check
        run: |
          set -o pipefail
          npx ts-node scripts/check-deployed-versions.ts 2>&1 | tee check.log
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          ETHEREUM_SEPOLIA_RPC_URL: ${{ secrets.ETHEREUM_SEPOLIA_RPC_URL }}

      # always(): the table is most worth reading on the run that failed.
      - name: Publish the table
        if: always()
        run: |
          {
            echo '### Deployed versions'
            echo
            echo '```'
            cat check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1

      # fail-on: none reports without gating. Raise it to `high` once the three existing
      # high-severity findings are triaged, otherwise this job goes red on day one.
      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        id: slither
        with:
          slither-config: slither.config.json
          sarif: results.sarif
          fail-on: none

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: results.sarif
